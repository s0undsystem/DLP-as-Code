# Example policy: Microsoft 365 Copilot surface, scoped to individual users.
#
# Copilot is deployed differently from the other locations: the compiler emits a
# `copilotLocations` JSON blob (Workload=Applications / Location=Copilot.M365 with one
# IndividualResource inclusion per user) plus `enforcementPlanes: [CopilotExperiences]`,
# and injects a RestrictAccess action onto every rule - Purview refuses to create a
# Copilot rule without one.
#
# `scope.users` are PLACEHOLDERS. Replace them with real UPNs from your tenant.
name: example-copilot-secrets
description: Simulate blocking credentials pasted into Microsoft 365 Copilot (example).
mode: TestWithoutNotifications
scope:
  users:
  - user@example.com
  - another.user@example.com
locations:
  copilot: true
rules:
- name: example-copilot-secrets-UploadText
  hasActivity: UploadText
  detect:
    groups:
    - name: Credentials
      sensitiveTypes:
      - name: Example Credential SIT
        confidence: Medium
